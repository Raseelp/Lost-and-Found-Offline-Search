name: lost_and_found
description: "Lost & Found: Offline Search — find your photos and videos by describing them, all on-device."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  google_fonts: ^6.3.2
  sqflite: ^2.4.2
  path: ^1.9.1
  content_resolver: ^0.3.4
  permission_handler: ^12.0.1
  video_player: ^2.10.1
  shared_preferences: ^2.3.3
  flutter_staggered_grid_view: ^0.7.0
  sensors_plus: ^7.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/clip_tokenizer/vocab.json
    - assets/clip_tokenizer/merges.txt
    # The license of the search model's weights (Apple's), shown with the app's other licenses.
    - assets/licenses/
    # Fonts are bundled (google_fonts finds them here), so the app never fetches them from the internet.
    - assets/fonts/
    # The first-run tour's sample photos.
    - assets/tour/photos/
    - assets/tour/videos/
    - assets/tour/faces/
